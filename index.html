<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Infracciones de Tránsito</title>
</head>
<body>
<h1>Sistema de Gestión de Infracciones</h1>
<p>Registro de infracciones con validación</p>
<form>
<label>Cédula:</label><input type="text" placeholder="001-0000000-0"><br><br>
<label>Placa:</label><input type="text" placeholder="A123456"><br><br>
<label>Tipo de infracción:</label>
<select>
<option>Exceso de velocidad</option>
<option>Semáforo en rojo</option>
<option>Sin licencia</option>
<option>Estacionamiento indebido</option>
</select><br><br>
<button>Registrar Infracción</button>
</form>
</body>
</html>
